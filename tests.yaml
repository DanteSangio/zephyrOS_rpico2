sample:
  name: Pico 2 Application
tests:
  app.pico2.heartbeat:
    tags:
      - gpio
      - led
    filter: dt_enabled_alias_with_parent_compat("led0", "gpio-leds")
    depends_on: gpio
    integration_platforms:
      - rpi_pico2/rp2350a/m33_0
    harness: console
    harness_config:
      type: multi_line
      ordered: true
      regex:
        - "heartbeat [0-9]+: LED ON"
        - "heartbeat [0-9]+: LED OFF"
