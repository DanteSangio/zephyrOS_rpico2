#
# Application Kconfig. Merged on top of the board defconfig, which already
# enables CONSOLE, SERIAL, UART_CONSOLE, GPIO, CLOCK_CONTROL, RESET and the
# HEX/UF2 build outputs, so those are intentionally not repeated here.
#
# Debug-only options live in debug.conf, see README.md.
#
# Serial role map (devices are chosen in boards/*.overlay):
#   console -> cdc_acm_uart0 (USB)  zephyr,console
#   shell   -> cdc_acm_uart0 (USB)  zephyr,shell-uart
#   logs    -> uart0 (GP0/GP1)      zephyr,log-uart + LOG_BACKEND_UART
# Recipes for moving any of these: see DEBUG_CONFIG.md.

CONFIG_GPIO=y

# Logging. The board overlay routes log output to UART0 (GP0/GP1) through the
# `zephyr,log-uart` chosen node, independently of the console device.
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BACKEND_UART=y

# Thread names are visible in `info threads` (GDB) and in crash dumps.
CONFIG_THREAD_NAME=y

# Console and interactive shell on the Pico 2 native USB (CDC-ACM).
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
# Keep logs out of the shell stream: they belong to the UART0 backend.
CONFIG_SHELL_LOG_BACKEND=n
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=128
CONFIG_SHELL_BACKEND_SERIAL_TX_RING_BUFFER_SIZE=128
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_PID=0x0004
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="pico2-app console"
CONFIG_UART_LINE_CTRL=y
CONFIG_STDOUT_CONSOLE=y

CONFIG_MAIN_STACK_SIZE=2048
