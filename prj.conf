#
# Application Kconfig. Merged on top of the board defconfig, which already
# enables CONSOLE, SERIAL, UART_CONSOLE, GPIO, CLOCK_CONTROL, RESET and the
# HEX/UF2 build outputs, so those are intentionally not repeated here.
#
# Debug-only options live in debug.conf, see README.md.

CONFIG_GPIO=y

# Logging over the default UART console.
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# Thread names are visible in `info threads` (GDB) and in crash dumps.
CONFIG_THREAD_NAME=y

CONFIG_MAIN_STACK_SIZE=2048
