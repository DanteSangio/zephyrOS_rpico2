#
# Debug-only Kconfig fragment. Kept out of prj.conf so release builds stay
# small. Use it with:
#
#   west build -p always -b rpi_pico2/rp2350a/m33_0 . -- -DEXTRA_CONF_FILE=debug.conf
#
# or simply `make build`.

# Thread awareness for the SEGGER Zephyr RTOS plugin (GDB `info threads`).
CONFIG_DEBUG_THREAD_INFO=y
CONFIG_THREAD_STACK_INFO=y

# -Og instead of -O2: line stepping that matches the source.
CONFIG_DEBUG_OPTIMIZATIONS=y

# Second log channel over RTT, in addition to the UART0 backend in prj.conf.
# Used by `west rtt --runner jlink`.
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_MODE_IMMEDIATE=y
