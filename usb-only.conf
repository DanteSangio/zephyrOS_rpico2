#
# Single-cable experiment: console + shell + logs all on the USB CDC-ACM port.
# Used as an extra fragment, so prj.conf stays untouched:
#
#   make build EXTRA_CONF="debug.conf;usb-only.conf"
#   make flash
#
# Rollback: `make build && make flash` (debug.conf only).

# Print log records through the shell instead of a dedicated UART backend.
CONFIG_SHELL_LOG_BACKEND=y

# No logs on the external USB-UART converter.
CONFIG_LOG_BACKEND_UART=n

# debug.conf selects CONFIG_LOG_MODE_IMMEDIATE. The shell log backend in
# immediate mode drives cdc_acm_poll_out() directly, which drops bytes for a
# CDC-ACM port (no TX work is scheduled without echo mitigation): log lines
# arrive truncated and the prompt disappears. Deferred mode keeps the shell's
# interrupt-driven transport and only hands records to the shell thread.
CONFIG_LOG_MODE_DEFERRED=y

# A colorized log line plus the prompt redraw exceeds prj.conf's 128-byte ring,
# so the shell dropped bytes in the middle of records.
CONFIG_SHELL_BACKEND_SERIAL_TX_RING_BUFFER_SIZE=1024
